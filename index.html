<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF8C00" />
  <!-- Per-page title, description, robots, canonical and og/twitter text are
       written here at build time by scripts/vite-plugin-prerender.mjs. -->
  <!--app-head-->
  <!-- Content is revealed on scroll by JavaScript; without it, show everything. -->
  <noscript><style>.reveal{opacity:1 !important;transform:none !important}</style></noscript>

  <!-- Open Graph -->
  <meta property="og:site_name" content="MangoRooms" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:image" content="https://www.mangorooms.ro/images/landing.webp" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.mangorooms.ro/images/landing.webp" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BedAndBreakfast",
    "name": "MangoRooms",
    "description": "Cozy, motorcycle-friendly, family-run guesthouse in Brașov, Romania, welcoming international travellers and backpackers since 2007.",
    "image": ["https://www.mangorooms.ro/images/landing.webp"],
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Mihai Viteazul 128",
      "postalCode": "500183",
      "addressLocality": "Brașov",
      "addressCountry": "RO"
    },
    "hasMap": "https://maps.app.goo.gl/xDLBLkZsb61cQ6eh8",
    "telephone": "+40721373747",
    "email": "anudani241@hotmail.com",
    "url": "https://www.mangorooms.ro/",
    "foundingDate": "2007",
    "knowsLanguage": ["en", "ro", "de", "it", "es", "fr", "et", "ru", "fi"],
    "amenityFeature": [
      { "@type": "LocationFeatureSpecification", "name": "Secure motorcycle parking", "value": true },
      { "@type": "LocationFeatureSpecification", "name": "Free Wi-Fi", "value": true },
      { "@type": "LocationFeatureSpecification", "name": "Private bathrooms", "value": true },
      { "@type": "LocationFeatureSpecification", "name": "Shared kitchen", "value": true }
    ]
  }
  </script>

  <!-- ajuns.ro reservation request form: elements with data-ajuns-open open it. -->
  <script src="https://ajuns.ro/widget.js" data-ajuns-form="-97PFsmCptfb8czpiOC9FQ" data-button="none" data-lang="en" async></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
